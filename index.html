<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T.A.L.K.E.R. Isolated | Garrys'mod RP</title>
<style>
  :root{
    --accent:#c8a24a;      /* тускло-золотой акцент (S.T.A.L.K.E.R.) */
    --accent-dim:#7a6530;
    --ink:#e7e2d4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;overflow:hidden;background:#000;}
  body{
    font-family:'Segoe UI',Tahoma,Verdana,Arial,sans-serif;
    color:var(--ink);
    position:relative;
    user-select:none;
    -webkit-user-select:none;
  }

  /* Фоновое видео на весь экран (анимированный арт) */
  .bg{
    position:fixed;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    z-index:1;
  }

  /* Затемнение + виньетка для читаемости текста */
  .overlay{
    position:fixed;inset:0;z-index:2;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.1) 35%, rgba(0,0,0,0.65) 100%);
  }

  /* Лёгкая «плёнка»/зерно */
  .grain{
    position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grainshift 0.6s steps(2) infinite;
  }
  @keyframes grainshift{0%{transform:translate(0,0);}100%{transform:translate(-4px,3px);}}

  /* Контент */
  .content{
    position:fixed;inset:0;z-index:4;
    display:flex;flex-direction:column;
    justify-content:flex-end;
    padding:0 6vw 7vh;
  }

  .title{
    font-size:clamp(28px,6vw,72px);
    font-weight:800;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 2px 24px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
    margin-bottom:0.3em;
  }
  .subtitle{
    font-size:clamp(13px,1.6vw,20px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--accent);
    text-shadow:0 2px 12px rgba(0,0,0,0.9);
    margin-bottom:1.6em;
  }

  /* Полоса загрузки (декоративная, бесконечная) */
  .loader{
    display:flex;align-items:center;gap:18px;max-width:720px;
  }
  .bar{
    position:relative;flex:1;height:6px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(200,162,74,0.35);
    overflow:hidden;
  }
  .bar::before{
    content:"";position:absolute;top:0;left:-40%;height:100%;width:40%;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    animation:slide 1.8s cubic-bezier(.6,0,.4,1) infinite;
  }
  @keyframes slide{0%{left:-45%;}100%{left:105%;}}

  .loading-text{
    font-size:clamp(11px,1.3vw,15px);
    letter-spacing:0.25em;text-transform:uppercase;
    color:var(--ink);white-space:nowrap;
    text-shadow:0 1px 8px rgba(0,0,0,0.9);
  }
  .loading-text .dots::after{
    content:"";animation:dots 1.6s steps(4,end) infinite;
  }
  @keyframes dots{0%{content:"";}25%{content:".";}50%{content:"..";}75%{content:"...";}100%{content:"";}}

  /* Запрос на включение звука (фолбэк, если браузер блокирует автовоспроизведение) */
  #sound-gate{
    position:fixed;inset:0;z-index:10;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(2px);
    cursor:pointer;
    transition:opacity 0.6s ease;
  }
  #sound-gate.hidden{opacity:0;pointer-events:none;}
  #sound-gate .btn{
    border:1px solid var(--accent);
    color:var(--ink);
    padding:16px 32px;
    letter-spacing:0.25em;text-transform:uppercase;
    font-size:clamp(12px,1.4vw,16px);
    background:rgba(0,0,0,0.4);
    text-shadow:0 1px 8px rgba(0,0,0,0.9);
  }
  #sound-gate .btn span{color:var(--accent);}
</style>
</head>
<body>
  <video class="bg" autoplay loop muted playsinline preload="auto" poster="">
    <source src="background.webm" type="video/webm">
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <div class="grain"></div>

  <div class="content">
    <div class="title">S.T.A.L.K.E.R. Isolated</div>
    <div class="subtitle">Garry's mod RP</div>
    <div class="loader">
      <div class="loading-text">Загрузка сервера<span class="dots"></span></div>
      <div class="bar"></div>
    </div>
  </div>

  <!-- Фоновая музыка (зациклена) -->
  <audio id="bgm" src="music.mp3" loop preload="auto"></audio>

  <!-- Фолбэк: если браузер запретил автостарт со звуком -->
  <div id="sound-gate">
    <div class="btn">▶ Нажмите, чтобы <span>включить звук</span></div>
  </div>

<script>
  (function(){
    var audio = document.getElementById('bgm');
    var gate  = document.getElementById('sound-gate');
    audio.volume = 0.6;

    function hideGate(){ gate.classList.add('hidden'); }

    // Пытаемся сразу запустить музыку (в GMod loading screen часто работает)
    function tryPlay(){
      var p = audio.play();
      if (p && typeof p.then === 'function') {
        p.then(hideGate).catch(function(){ /* браузер ждёт клик—показываем кнопку */ });
      } else {
        hideGate();
      }
    }

    // По любому взаимодействию — запуск и скрытие кнопки
    function kick(){
      audio.play().then(hideGate).catch(hideGate);
    }
    gate.addEventListener('click', kick);
    document.addEventListener('click', kick, {once:false});
    document.addEventListener('keydown', kick, {once:false});
    document.addEventListener('touchstart', kick, {once:false});

    if (document.readyState === 'complete') tryPlay();
    else window.addEventListener('load', tryPlay);
  })();
</script>
</body>
</html>
